services:
  postgres:
    image: postgres:17-alpine
    container_name: daily-log-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-daily_log}
      POSTGRES_USER: ${DB_USER:-daily_log}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daily_log}
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-daily_log} -d ${DB_NAME:-daily_log}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    container_name: daily-log-backend
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-daily_log}
      DB_USER: ${DB_USER:-daily_log}
      DB_PASSWORD: ${DB_PASSWORD:-daily_log}
      DB_SSLMODE: disable
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: http
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8080}
    container_name: daily-log-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped
